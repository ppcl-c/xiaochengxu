    <title>注册</title>

</head>
<body>
<input type="text" id="den" placeholder="您的名字">
<input type="text" id="pwd" placeholder="您的密码">
<button onclick="getText()">登录</button>
<script>
    function getText(){
        let den = document.getElementById("den").value;
        let pwd = document.getElementById("pwd").value;
        alert(den + pwd)
        fetch("/az?den=" + encodeURIComponent(den) + "&pwd=" + encodeURIComponent(pwd))
        alert("注册成功")
    }
</script>
